name: Build DupClean Desktop App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish standalone Windows EXE
        run: dotnet publish DupClean.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DupClean-Windows-x64
          path: publish/DupClean.exe
          if-no-files-found: error
